      - "client/www/js/controller.settingctrl.js"
      - "client/www/js/controller.setting.radio.js"
      - "client/www/js/service.util.js"
      - "client/www/templates/units.html"
      - "client/www/templates/setting-radio.html"
      - "client/www/templates/nation.html"
      - "client/www/templates/nation-air.html"
      - "client/www/templates/kma-special.html"
      - "client/www/js/service.monetization.js"
      - "client/www/js/service.admobemi.js"
      - "client/www/js/service.twads.js"
      - "client/www/js/controller.start.js"
      - "client/www/templates/start.html"
      - "client/www/js/controller.searchctrl.js"
      - "client/www/templates/tab-search.html"
      - "client/www/js/controller.push.js"
      - "client/www/js/service.firebase.js"
      - "client/www/templates/setting-push.html"
      - "tw.ios/www/lib/ionic-timepicker/src/ionic-timepicker.provider.js"
      - "client/bower.json"
      - "client/www/fonts/MaterialIcons-Regular.ttf"
      - "client/tw.resources/android/icon/**"
      - "client/tw.resources/android-launcher-icon.png"
      - "server/app.js"
      - "server/routes/**"
      - "server/package-lock.json"
      - ".github/workflows/android.yml"
  # Android release verification (android-release.yml) runs these jobs on the commit it verifies.
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out (empty: the commit of the calling event)"
        required: false
        type: string
concurrency:
  # First attempts of a pull request's runs share a group and cancel older ones. Re-runs,
  # pushes and manual runs get their own group, so a re-run of an older commit can never
  # cancel or replace the newest commit's run.
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
permissions:
  contents: read
jobs:
  build:
    name: Build and test (with client import check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Imported client assets, golden corpus and server route table are current
        run: |
          python3 android/tools/import_client_assets.py
          node android/tools/corpus/generate.mjs
          node android/tools/server-routes/generate.mjs
          git diff --exit-code -- android
          test -z "$(git status --porcelain -- android)"
      - name: Captured references match their sources and declared matrix
        run: |
          node android/tools/emulator/check-sources.mjs
          node --test android/tools/emulator/reference-view.test.mjs android/tools/parity-reference/check.test.mjs
          python3 android/tools/parity-reference/test_check_results.py
          node android/tools/parity-reference/check.mjs
      # Maven Central answers downloads of these large jars with 429 Too Many Requests often enough that they are
      # kept in the Actions cache; a run on master saves them, pull requests restore them.
      - uses: actions/cache@v4
        with:
          path: android/.gradle/robolectric-runtimes
          key: robolectric-runtimes-${{ hashFiles('android/app/robolectric-runtimes.txt') }}
      - name: Robolectric runtimes
        working-directory: android
        # Fetches only what the cache did not have; a refused download is tried again.
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :app:copyRobolectricRuntimes && exit 0
            echo "attempt $attempt failed"
            [ "$attempt" = 5 ] || sleep $((attempt * 30))
          done
          exit 1
      - name: Build and unit tests
        working-directory: android
        run: |
          ./gradlew assembleDebug test
          python3 tools/parity-reference/check-results.py
      - name: Upgrade test cleanup (adb test double)
        run: sh android/tools/upgrade/test-cleanup.sh
      - name: Instrumentation result check (recorded outputs, adb test double)
        run: |
          sh android/tools/emulator/test-instrumentation-passed.sh
          sh android/tools/release-ci/test-runners.sh
      - name: Release export and build wrapper (test repositories, stand-in gradlew)
        run: |
          python3 android/tools/release/test_export_candidate.py
          sh android/tools/release/test-gradle-release.sh
  without-client:
    name: Build and test without client/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Remove client/
        run: rm -rf client && test ! -e client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Maven Central answers downloads of these large jars with 429 Too Many Requests often enough that they are
      # kept in the Actions cache; a run on master saves them, pull requests restore them.
      - uses: actions/cache@v4
        with:
          path: android/.gradle/robolectric-runtimes
          key: robolectric-runtimes-${{ hashFiles('android/app/robolectric-runtimes.txt') }}
      - name: Robolectric runtimes
        working-directory: android
        # Fetches only what the cache did not have; a refused download is tried again.
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :app:copyRobolectricRuntimes && exit 0
            echo "attempt $attempt failed"
            [ "$attempt" = 5 ] || sleep $((attempt * 30))
          done
          exit 1
      - name: Build and unit tests
        working-directory: android
        run: |
          ./gradlew assembleDebug test
          python3 tools/parity-reference/check-results.py

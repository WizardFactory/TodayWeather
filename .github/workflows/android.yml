permissions:
  contents: read
jobs:
  build:
    name: Build and test (with client import check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Imported client assets, golden corpus and server route table are current
        run: |
          python3 android/tools/import_client_assets.py
          node android/tools/corpus/generate.mjs
          node android/tools/server-routes/generate.mjs
          git diff --exit-code -- android
          test -z "$(git status --porcelain -- android)"
      - name: Captured references match their sources and declared matrix
        run: |
          node android/tools/emulator/check-sources.mjs
          node --test android/tools/emulator/reference-view.test.mjs android/tools/parity-reference/check.test.mjs
          python3 android/tools/parity-reference/test_check_results.py
          node android/tools/parity-reference/check.mjs
      - name: Build and unit tests
        working-directory: android
        run: |
          ./gradlew assembleDebug test
          python3 tools/parity-reference/check-results.py
      - name: Upgrade test cleanup (adb test double)
        run: sh android/tools/upgrade/test-cleanup.sh
  without-client:
    name: Build and test without client/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Remove client/
        run: rm -rf client && test ! -e client
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        working-directory: android
        run: |
          ./gradlew assembleDebug test
          python3 tools/parity-reference/check-results.py

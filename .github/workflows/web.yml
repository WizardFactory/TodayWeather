name: Web app
on:
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.json"
      - "*config.ts"
      - "infra/web/**"
      - "docs/rewrite/examples/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/web-live-smoke.yml"
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - "packages/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.json"
      - "*config.ts"
      - "infra/web/**"
      - "docs/rewrite/examples/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/web-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-evidence
          retention-days: 30
          path: |
            reports/verification/web/screenshots
            test-results
      - uses: actions/upload-artifact@v4
        with:
          name: web-static-dist
          path: web/dist
          # Rollback source: keep the artifact of each deployed commit (see infra/web/static/README.md).
          retention-days: 90

name: Gather offline regression

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/gather-offline.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/gather-offline.yml'

permissions:
  contents: read

jobs:
  gather-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/gather-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mocha@2.5.3 cheerio@0.20.0 xml2js@0.4.23 async@2.6.4 mongoose@5.1.2 sprintf@0.1.5 express@4.13.4 iconv-lite@0.4.24 dotenv@10.0.0 cors@2.8.5 express-session@1.15.6 sql.js@1.8.0 body-parser@1.13.3 request@2.88.2
      - name: Run synthetic regression and functional smoke
        env:
          NODE_PATH: ${{ runner.temp }}/gather-offline/node_modules
        run: |
          npm --prefix server run test:offline
          node server/test/offline/push-transport-recovery-smoke.js
      - name: Run unified data.go.kr key and forecast-cycle HTTP smokes
        env:
          NODE_PATH: ${{ runner.temp }}/gather-offline/node_modules
        run: |
          node server/test/offline/data-go-kr-keys-smoke.js
          node server/test/offline/gather-quota-smoke.js
      - name: Run overseas budget HTTP smoke
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/gather-offline/node_modules
        run: node server/test/offline/vc-budget-smoke.js
      - name: Run daily forecast response smoke
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/gather-offline/node_modules
        run: |
          node server/test/offline/daily-response-smoke.js
          node server/test/offline/pollen-route-smoke.js

  gateway-node16:
    # The gateway routes (#2606) run on the production Node 16.20.2 as well.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '16.20.2'
          package-manager-cache: false
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/gateway-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mongoose@5.1.2 express@4.13.4 cors@2.8.5 express-session@1.15.6
      - name: Run gateway tests
        env:
          NODE_PATH: ${{ runner.temp }}/gateway-offline/node_modules
        run: |
          node server/test/offline/gateway-geocoder.test.js
          node server/test/offline/gateway-route.test.js
          node server/test/offline/gateway-callers.test.js

  history-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['16.20.2', '22.22.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install isolated history test dependencies
        run: npm install --prefix "$RUNNER_TEMP/history-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mongodb-memory-server-core@10.1.4 mongoose@5.1.2 xml2js@0.4.23 async@2.6.4 sprintf@0.1.5 express@4.13.4
      - name: Run real local history persistence and response smoke
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/history-offline/node_modules
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/history-mongodb
        run: node server/test/offline/history-integration-smoke.js
      - name: Check KST policy on a non-KST host timezone
        env:
          TZ: America/Los_Angeles
          NODE_PATH: ${{ runner.temp }}/history-offline/node_modules
        run: node server/test/offline/history-observations.test.js

  airkorea-nation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '16.20.2'
          package-manager-cache: false
      - name: Install isolated air integration dependencies
        run: npm install --prefix "$RUNNER_TEMP/airkorea-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mongoose-smoke@npm:mongoose@5.13.23 mongodb-memory-server-core@10.1.4 axios@0.18.1 async@2.6.4 express@4.13.4
      - name: Verify collection, nation response and shared global cache on local Mongo
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/airkorea-offline/node_modules
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/airkorea-mongodb
        run: node server/test/offline/airkorea-nation-smoke.js

  current-grid-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['16.20.2', '22.22.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install isolated current test dependencies
        run: npm install --prefix "$RUNNER_TEMP/current-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mongoose@5.1.2 mongoose-smoke@npm:mongoose@5.13.23 mongodb-memory-server-core@10.1.4 async@2.6.4 request@2.88.2 xml2js@0.4.23 express@4.13.4
      - name: Verify pinned queries, quota memory and real current persistence
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/current-offline/node_modules
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/current-mongodb
        run: |
          node server/test/offline/current-grid-collection.test.js
          node server/test/offline/current-lifecycle.test.js
          node server/test/offline/current-writer-cancellation.test.js
          node server/test/offline/current-cancellation-smoke.js
          node server/test/offline/current-manager.test.js
          node server/test/offline/current-quota-memory.test.js
          node server/test/offline/forecast-traffic.test.js
          node server/test/offline/current-collection-smoke.js

  forecast-grid-node16:
    # Mongo4.4 retains the wire operations used by the production Mongoose5.1.2 driver.
    runs-on: ubuntu-latest
    container: node:16.20.2-bullseye
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install isolated pinned forecast test dependencies
        run: npm install --prefix /tmp/forecast-offline --ignore-scripts --no-audit --no-fund --package-lock=false mongoose@5.1.2 async@2.6.4 request@2.88.2 xml2js@0.4.23
      - name: Prepare compatible temporary Mongo binary
        run: |
          curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2004-4.4.29.tgz -o /tmp/forecast-mongo.tgz
          tar -xzf /tmp/forecast-mongo.tgz -C /tmp
      - name: Verify forecast coverage, lifecycle and real pinned persistence
        env:
          TZ: UTC
          NODE_PATH: /tmp/forecast-offline/node_modules
          TW_MONGOD: /tmp/mongodb-linux-x86_64-ubuntu2004-4.4.29/bin/mongod
        run: |
          node server/test/offline/forecast-grid-collection.test.js
          node server/test/offline/forecast-manager.test.js
          node server/test/offline/forecast-lifecycle.test.js
          node server/test/offline/forecast-late-publication.test.js
          node server/test/offline/forecast-collection-smoke.js
          node server/test/offline/forecast-coverage-mongo-smoke.js

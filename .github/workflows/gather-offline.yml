name: Gather offline regression

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/gather-offline.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/gather-offline.yml'

permissions:
  contents: read

jobs:
  gather-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/gather-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mocha@2.5.3 cheerio@0.20.0 xml2js@0.4.23 async@2.6.4 mongoose@5.1.2 sprintf@0.1.5 express@4.13.4 iconv-lite@0.4.24
      - name: Run synthetic regression and functional smoke
        env:
          NODE_PATH: ${{ runner.temp }}/gather-offline/node_modules
        run: npm --prefix server run test:offline
      - name: Run daily forecast response smoke
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/gather-offline/node_modules
        run: node server/test/offline/daily-response-smoke.js

  history-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['16.20.2', '22.22.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install isolated history test dependencies
        run: npm install --prefix "$RUNNER_TEMP/history-offline" --ignore-scripts --no-audit --no-fund --package-lock=false mongodb-memory-server-core@10.1.4 mongoose@5.1.2 xml2js@0.4.23 async@2.6.4 sprintf@0.1.5 express@4.13.4
      - name: Run real local history persistence and response smoke
        env:
          TZ: UTC
          NODE_PATH: ${{ runner.temp }}/history-offline/node_modules
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/history-mongodb
        run: node server/test/offline/history-integration-smoke.js
      - name: Check KST policy on a non-KST host timezone
        env:
          TZ: America/Los_Angeles
          NODE_PATH: ${{ runner.temp }}/history-offline/node_modules
        run: node server/test/offline/history-observations.test.js

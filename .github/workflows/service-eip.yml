name: Service EIP readiness
on:
  pull_request:
    paths: ['infra/aws/service-eip/**', '.github/workflows/service-eip.yml']
  push:
    branches: [master]
    paths: ['infra/aws/service-eip/**', '.github/workflows/service-eip.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s infra/aws/service-eip/tests -v
      - run: python infra/aws/service-eip/smoke.py

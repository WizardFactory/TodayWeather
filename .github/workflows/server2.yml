name: Server2
on:
  pull_request:
    paths:
      - "server2/**"
      - ".github/workflows/server2.yml"
permissions:
  contents: read
jobs:
  placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci.sh placement
  python:
    needs: placement
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci.sh python
  rust:
    needs: placement
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci.sh rust
  gnu:
    needs: placement
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci.sh gnu
  foundation:
    needs: [placement, python, rust, gnu]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server2
    steps:
      - name: Require all verification jobs to pass
        if: >-
          ${{ needs.placement.result != 'success' ||
              needs.python.result != 'success' ||
              needs.rust.result != 'success' ||
              needs.gnu.result != 'success' }}
        working-directory: .
        run: exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci.sh musl
      - uses: actions/upload-artifact@v4
        with:
          name: server2-linux-musl-verified
          path: reports/verification/server2-local-first/artifact-native/
          if-no-files-found: error
          retention-days: 7
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/golden/ci.py --install

name: Server2
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 tools/ci.py --audit-only
  foundation:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server2-linux-musl-verified
          path: reports/verification/server2-local-first/artifact-native/
          if-no-files-found: error
          retention-days: 30
  goldens:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/golden/ci.py --install

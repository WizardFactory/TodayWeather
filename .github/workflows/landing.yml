name: Landing page
on:
  pull_request:
    paths: ['landing/**', 'scripts/verification/landing-page.test.mjs', 'scripts/landing-font-subset.py', '.github/workflows/landing.yml']
  push:
    branches: [master, main]
    paths: ['landing/**', 'scripts/verification/landing-page.test.mjs', 'scripts/landing-font-subset.py', '.github/workflows/landing.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/verification/landing-page.test.mjs

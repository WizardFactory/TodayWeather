name: iOS
on:
  pull_request:
    paths:
      - "ios/**"
      # Sources of ios/tools/import_client_assets.py, so a change there shows up as a stale copy.
      - "client/www/img/**"
      - "client/www/locales/**"
      - "client/www/data/town.js"
      - "client/www/fonts/MaterialIcons-Regular.ttf"
      - "client/tw.resources/icon.png"
      - "client/tw.resources/ios/splash/**"
      - "android/app/src/main/res/font/ionicons.ttf"
      - "android/app/provenance/cordova-fonts.json"
      # Source of ios/tools/import_corpus.py (the golden corpus copy).
      - "android/core-domain/src/test/resources/corpus/**"
      # Sources of ios/tools/push/generate.py (the Cordova iOS push requests).
      - "client/www/js/service.push.js"
      - "client/www/js/service.weatherutil.js"
      # Source of ios/tools/import_chart_reference.py (the Cordova chart scenes captured for Android).
      - "android/core-domain/src/test/resources/chart-reference/**"
      # Sources of ios/tools/weather/generate.py (the Cordova weather request timing in JavaScriptCore).
      - "client/www/js/service.weatherutil.js"
      - "client/www/js/service.weatherinfo.js"
      # Sources of ios/tools/air/generate.py (the air standards' grade and scale mapping in JavaScriptCore) and of
      # ios/tools/share/generate.py (IN-16: the share message, with service.weatherutil.js and the locales above).
      - "client/www/js/controller.tabctrl.js"
      - "client/www/js/controller.air.js"
      # Sources of ios/tools/settings/generate.py (the Cordova settings, hand-offs and push re-post in JavaScriptCore).
      - "client/www/js/service.util.js"
      - "client/www/js/controller.units.js"
      - "client/www/js/controller.setting.radio.js"
      - "client/www/js/controller.settingctrl.js"
      - "client/www/js/service.push.js"
      - "client/www/data/theme.js"
      # Sources of the S01 captures (ios/tools/start-reference, IN-10), so a change of the Cordova start page runs
      # the comparison.
      - "client/www/templates/start.html"
      - "client/www/js/controller.start.js"
      # Sources of the S02 captures (ios/tools/places-reference, IN-11).
      - "client/www/templates/tab-search.html"
      - "client/www/js/controller.searchctrl.js"
      # Sources of ios/tools/push/generate.py's S09 goldens (alarms.js) and of the S09 captures
      # (ios/tools/push-reference, IN-14).
      - "client/www/js/controller.push.js"
      - "client/www/templates/setting-push.html"
      - "tw.ios/www/lib/ionic-timepicker/src/ionic-timepicker.provider.js"
      # Sources of ios/tools/import_ad_privacy.py and ios/tools/ads/generate.py (IN-15).
      - "client/resources/ios/tracking/**"
      - "client/config.xml"
      - "client/package-lock.json"
      - "client/scripts/ios-ad-request-rule.h"
      - "client/www/js/service.monetization.js"
      - "client/www/js/service.admobemi.js"
      # Sources of ios/tools/nation/generate.py (IN-13: the nationwide pages and warnings in JavaScriptCore).
      - "client/www/js/controller.nation.js"
      - "client/www/js/controller.nation.air.js"
      - "client/www/js/controller.kma.special.js"
      - "client/www/templates/nation.html"
      - "client/www/templates/nation-air.html"
      - "client/www/templates/kma-special.html"
      # Sources of ios/tools/server-routes/generate.py (IN-18: the legacy server's route table for the request-path
      # test), which runs the Android route generator over server/.
      - "server/app.js"
      - "server/routes/**"
      - "server/package-lock.json"
      - "android/tools/server-routes/generate.mjs"
      - ".github/workflows/ios.yml"
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "client/www/img/**"
      - "client/www/locales/**"
      - "client/www/data/town.js"
      - "client/www/fonts/MaterialIcons-Regular.ttf"
      - "client/tw.resources/icon.png"
      - "client/tw.resources/ios/splash/**"
      - "android/app/src/main/res/font/ionicons.ttf"
      - "android/app/provenance/cordova-fonts.json"
      - "android/core-domain/src/test/resources/corpus/**"
      - "client/www/js/service.push.js"
      - "client/www/js/service.weatherutil.js"
      - "android/core-domain/src/test/resources/chart-reference/**"
      - "client/www/js/service.weatherutil.js"
      - "client/www/js/service.weatherinfo.js"
      - "client/www/js/controller.tabctrl.js"
      - "client/www/js/controller.air.js"
      - "client/www/js/service.util.js"
      - "client/www/js/controller.units.js"
      - "client/www/js/controller.setting.radio.js"
      - "client/www/js/controller.settingctrl.js"
      - "client/www/js/service.push.js"
      - "client/www/data/theme.js"
      # Sources of the S01 captures (ios/tools/start-reference, IN-10), so a change of the Cordova start page runs
      # the comparison.
      - "client/www/templates/start.html"
      - "client/www/js/controller.start.js"
      # Sources of the S02 captures (ios/tools/places-reference, IN-11).
      - "client/www/templates/tab-search.html"
      - "client/www/js/controller.searchctrl.js"
      # Sources of ios/tools/push/generate.py's S09 goldens (alarms.js) and of the S09 captures
      # (ios/tools/push-reference, IN-14).
      - "client/www/js/controller.push.js"
      - "client/www/templates/setting-push.html"
      - "tw.ios/www/lib/ionic-timepicker/src/ionic-timepicker.provider.js"
      # Sources of ios/tools/import_ad_privacy.py and ios/tools/ads/generate.py (IN-15).
      - "client/resources/ios/tracking/**"
      - "client/config.xml"
      - "client/package-lock.json"
      - "client/scripts/ios-ad-request-rule.h"
      - "client/www/js/service.monetization.js"
      - "client/www/js/service.admobemi.js"
      # Sources of ios/tools/nation/generate.py (IN-13).
      - "client/www/js/controller.nation.js"
      - "client/www/js/controller.nation.air.js"
      - "client/www/js/controller.kma.special.js"
      - "client/www/templates/nation.html"
      - "client/www/templates/nation-air.html"
      - "client/www/templates/kma-special.html"
      # Sources of ios/tools/server-routes/generate.py (IN-18).
      - "server/app.js"
      - "server/routes/**"
      - "server/package-lock.json"
      - "android/tools/server-routes/generate.mjs"
      - ".github/workflows/ios.yml"

# Xcode 26.6 is the default of the macos-26 image; the iOS 26.5 simulator ships with it. Local builds use
# Xcode 27 (ios/README.md); both build the iOS 17.0 deployment target.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  SIMULATOR: "platform=iOS Simulator,name=iPhone 17,OS=26.5"

jobs:
  build:
    name: Build and test (with client import check)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node runs the Android route generator for ios/tools/server-routes/generate.py (IN-18).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Imported client assets, golden corpus, chart scenes, push requests and S09 goldens, weather request timing, air scales, settings steps, ad privacy entries and the server route table are current
        run: |
          python3 ios/tools/import_client_assets.py
          python3 ios/tools/import_corpus.py
          python3 ios/tools/import_chart_reference.py
          python3 ios/tools/push/generate.py
          python3 ios/tools/weather/generate.py
          python3 ios/tools/air/generate.py
          python3 ios/tools/settings/generate.py
          python3 ios/tools/import_ad_privacy.py
          python3 ios/tools/ads/generate.py
          python3 ios/tools/share/generate.py
          python3 ios/tools/nation/generate.py
          python3 ios/tools/server-routes/generate.py
          git diff --exit-code -- ios
          test -z "$(git status --porcelain -- ios)"
      - name: Core package tests (macOS)
        working-directory: ios/Core
        run: swift test
      - name: App build and tests (iOS Simulator)
        working-directory: ios
        run: >
          xcodebuild -project TodayWeather.xcodeproj -scheme TodayWeather -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test
      # IN-11: the UI tests with real touches run from ios/tools/places-ui/run-places-ui.sh (an ad hoc signed build and a
      # prepared simulator); CI builds them so they keep compiling.
      - name: UI tests build (iOS Simulator)
        working-directory: ios
        run: >
          xcodebuild -project TodayWeather.xcodeproj -scheme TodayWeatherUITests -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing
      # The screenshot tests write their renders and difference images to the test host's tmp/chart-compare; keep
      # them when a comparison fails, so a difference of the CI toolchain can be looked at.
      - name: Collect the screenshot comparisons
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshot-compare"
          find "$HOME/Library/Developer/CoreSimulator/Devices" -path '*/tmp/chart-compare/*' -name '*.png' \
            -exec cp {} "$RUNNER_TEMP/screenshot-compare/" \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-compare
          path: ${{ runner.temp }}/screenshot-compare
          if-no-files-found: ignore
          retention-days: 7
  standalone:
    name: Build and test without client/, android/ and the legacy iOS directories
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Remove the directories the iOS build must not read
        run: |
          rm -rf client android tw.ios ta.ios applewatch
          for d in client android tw.ios ta.ios applewatch; do test ! -e "$d"; done
      - name: Core package tests (macOS)
        working-directory: ios/Core
        run: swift test
      - name: App build and tests (iOS Simulator)
        working-directory: ios
        run: >
          xcodebuild -project TodayWeather.xcodeproj -scheme TodayWeather -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test

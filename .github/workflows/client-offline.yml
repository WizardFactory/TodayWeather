name: Cordova client offline checks
on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-offline.yml"
  push:
    branches: [master, main]
    paths:
      - "client/**"
      - ".github/workflows/client-offline.yml"
permissions:
  contents: read
jobs:
  payment-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test client/test/payment-removal.test.cjs

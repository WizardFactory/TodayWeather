name: Cordova client offline checks
on:
  pull_request:
    paths:
      - "client/**"
      - "tw.ios/**"
      - ".github/workflows/client-offline.yml"
  push:
    branches: [master, main]
    paths:
      - "client/**"
      - "tw.ios/**"
      - ".github/workflows/client-offline.yml"
concurrency:
  # First attempts of a pull request's runs share a group and cancel older ones. Re-runs,
  # pushes and manual runs get their own group, so a re-run of an older commit can never
  # cancel or replace the newest commit's run.
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
permissions:
  contents: read
jobs:
  payment-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test client/test/payment-removal.test.cjs client/test/provider-notice.test.cjs client/test/monetization.test.cjs client/test/privacy-consent.test.cjs client/test/pollen-popup.test.cjs client/test/push-token-refresh.test.cjs client/test/ios-location-purpose.test.cjs client/test/ios-ad-privacy.test.cjs client/test/ios-tracking-settings.test.cjs client/test/storage-handback.test.cjs
      - run: node client/test/push-token-refresh-smoke.cjs
      - run: python3 tw.ios/tests/widget/test_project.py

  store-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: client
      - run: bundle exec ruby test/store-release.test.rb
        working-directory: client
      - run: bundle exec fastlane lanes
        working-directory: client
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'

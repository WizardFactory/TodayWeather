<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{BRAND}} — {{HEADING}}</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden}body{--u:{{UNIT}}px;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(155deg,#edf5ff 0%,#f7fbff 48%,#e7f1ff 100%);color:#152f4b}.brand{position:absolute;left:calc(74*var(--u));top:calc(60*var(--u));font-size:calc(30*var(--u));font-weight:750;color:#246cb2;letter-spacing:.02em}h1{position:absolute;left:calc(74*var(--u));right:calc(74*var(--u));top:calc(125*var(--u));margin:0;font-size:calc(74*var(--u));font-weight:750;line-height:1.15;letter-spacing:-.025em}.capture{position:absolute;left:50%;top:calc(300*var(--u));height:calc({{HEIGHT}}px - 490*var(--u));transform:translateX(-50%);padding:calc(16*var(--u));border-radius:calc(40*var(--u));background:white;box-shadow:0 0 0 calc(2*var(--u)) #dce8f5,0 calc(24*var(--u)) calc(58*var(--u)) #153b6c22}.capture img{display:block;height:100%;aspect-ratio:{{VIEW_WIDTH}}/{{VIEW_HEIGHT}}}.note{position:absolute;left:calc(90*var(--u));right:calc(90*var(--u));bottom:calc(60*var(--u));margin:0;font-size:calc(27*var(--u));line-height:1.45;color:#54708a}
</style></head><body><div class="brand">{{BRAND}}</div><h1>{{HEADING}}</h1><div class="capture"><img src="{{IMAGE}}" alt="{{ALT}}"></div><p class="note">{{NOTE}}</p></body></html>

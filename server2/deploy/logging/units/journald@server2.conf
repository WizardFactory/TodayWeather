# Journal namespace for server2.service and server2-logs.service.
# The local copy is always kept, also when the collector or the network is down.
# 1 GiB here plus 512 MiB for the system journal stays inside the 2 GiB log
# budget of server2/deploy/staging/prerequisites.json.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
# The server limits its own rate; the journal must not drop lines silently.
RateLimitIntervalSec=0
RateLimitBurst=0

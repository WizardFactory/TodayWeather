[workspace]
members = ["."]
resolver = "3"

[package]
autobenches = false
name = "server2"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }

instant-xml = "0.7.6"
xmlparser = "0.13.6"
base64 = "0.22"
flate2 = "1"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusty-s3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "server2-feasibility"
path = "benches/feasibility.rs"

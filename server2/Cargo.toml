[workspace]
members = ["."]
resolver = "3"

[package]
autobenches = false
name = "server2"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
# S17c: bounded concurrent city/fallback composition; already transitive via reqwest.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }

instant-xml = "0.7.6"
xmlparser = "0.13.6"
base64 = "0.22"
flate2 = "1"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusty-s3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# S18b-1: RS256 assertion of the Firebase service account (already in the lock through rustls).
ring = "0.17"
time = { version = "0.3", features = ["formatting", "macros"] }
# S11: IANA zone offsets for the legacy world Intl rule (bundled tz data, no runtime file reads).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std", "case-insensitive"] }
# S11: classify a VC connection closed before the response as the legacy ECONNRESET retry.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
# S17b: the verbatim HTTP/1.1 legacy hop of a forwarded direct request (already in the tree).
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# S15b-2: EUC-KR (KS X 1001) decoding of KMA AWS/city observation pages, as legacy iconv decodes them.
encoding_rs = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# S15b-2: paused-clock tests of owned acquisition deadlines.
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "server2-feasibility"
path = "benches/feasibility.rs"

[[example]]
name = "warning_seed_import"
path = "tools/migration/warning_seed_import.rs"

[[example]]
name = "history_seed_import"
path = "tools/migration/history_seed_import.rs"

[[example]]
name = "station_seed_import"
path = "tools/migration/station_seed_import.rs"

[[example]]
name = "push_registration_convert"
path = "tools/state/push_registration_convert.rs"

[[example]]
name = "push_registration_import"
path = "tools/state/push_registration_import.rs"

[[example]]
name = "s3_readiness"
path = "tools/s3_readiness.rs"

# Run from this directory after preparing .env. One API replica only.
services:
  app:
    build:
      context: ../..
      dockerfile: infra/web/Dockerfile
    restart: unless-stopped
    environment:
      WEB_API_MODE: live
      WEB_ORIGIN: https://${WEB_DOMAIN:?Set WEB_DOMAIN}
      WEB_TRUST_PROXY: 'true'
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      WEB_DATA_DIR: /data
    volumes:
      - notifications:/data
    # Only the reverse proxy reaches the API. Do not publish port 4174.
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  notifications:
  caddy_data:
  caddy_config:

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>오늘날씨 — TodayWeather</title>
    <meta
      name="description"
      content="어제와 비교하는 실시간 동네 날씨와 미세먼지 예보. 앱 또는 웹에서 바로 확인하세요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TodayWeather" />
    <meta property="og:title" content="오늘날씨 — TodayWeather" />
    <meta
      property="og:description"
      content="어제와 비교하는 실시간 동네 날씨와 미세먼지 예보. 앱 또는 웹에서 바로 확인하세요."
    />
    <meta property="og:url" content="https://link.todayweather.ai/open" />
    <meta property="og:image" content="https://link.todayweather.ai/assets/preview.png" />
    <meta name="apple-itunes-app" content="app-id=1041700694, app-argument=https://link.todayweather.ai/open" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#3981ea" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="stylesheet" href="/assets/open.css" />
    <script src="/assets/open.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="tw-title">
        <div class="brand">
          <img
            src="/assets/icon.svg"
            alt=""
            width="56"
            height="56"
            class="brand-icon"
          />
          <div>
            <p class="eyebrow" data-i18n="eyebrow">TodayWeather</p>
            <h1 id="tw-title" data-i18n="title">오늘날씨 열기</h1>
          </div>
        </div>

        <p class="lead" data-i18n="lead">
          어제와 비교하는 시간별·주간 날씨와 미세먼지 정보를 앱 또는 웹에서 바로 확인하세요.
        </p>

        <div class="actions">
          <a
            id="open-web"
            class="btn btn-primary"
            href="https://app.todayweather.ai/"
            data-i18n="openWeb"
          >
            웹에서 바로 보기
          </a>
          <a
            id="open-app"
            class="btn btn-secondary"
            href="https://play.google.com/store/apps/details?id=net.wizardfactory.todayweather"
            hidden
            data-i18n="openApp"
          >
            오늘날씨 앱에서 열기
          </a>
        </div>

        <p class="hint" id="inapp-hint" data-i18n="inappHint">
          카카오톡 등에서 앱이 열리지 않으면 브라우저 메뉴에서 Safari 또는 Chrome으로 열어 주세요.
        </p>

        <div class="stores" aria-label="App stores">
          <a
            id="store-ios"
            class="store-link"
            href="https://apps.apple.com/app/id1041700694"
            rel="noopener noreferrer"
            data-i18n="appStore"
          >
            App Store (iOS)
          </a>
          <a
            id="store-android"
            class="store-link"
            href="https://play.google.com/store/apps/details?id=net.wizardfactory.todayweather"
            rel="noopener noreferrer"
            data-i18n="googlePlay"
          >
            Google Play (Android)
          </a>
        </div>
      </section>

      <footer class="footer">
        <a href="https://todayweather.ai/" rel="noopener noreferrer">todayweather.ai</a>
        <span aria-hidden="true">·</span>
        <a
          href="https://todayweather.ai/mobile/privacy.html"
          rel="noopener noreferrer"
          data-i18n="privacy"
        >
          개인정보처리방침
        </a>
      </footer>
    </main>
  </body>
</html>
